baseURL = 'https://headinthecloud.uk/'
languageCode = 'en-gb'
title = 'Head in the Cloud'
theme = 'PaperMod'

# Pull lastmod from git commit history so PaperMod can show "updated"
# dates without you maintaining a frontmatter field per post.
enableGitInfo = true

# Google Analytics removed — replaced by Cloudflare Web Analytics (cookieless,
# no PECR/UK-GDPR consent banner required). Token is set under [params] below
# and injected by layouts/partials/extend_head.html when env = "production".
# [services]
#   [services.googleAnalytics]
#     ID = "G-DRMW566NWT"

[pagination]
  pagerSize = 10
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

# Required for search and JSON output
[outputs]
  home = ["HTML", "RSS", "JSON"]

[minify]
  disableXML = true
  minifyOutput = true

# ---------------------------------------------------------------------------
# Site parameters
# ---------------------------------------------------------------------------
[params]
  env = "production"
  # Analytics: Cloudflare Web Analytics in "Automatic" mode — injected at
  # the edge for proxied responses, no token or beacon script required here.
  title = "Head in the Cloud"
  description = "Azure focused - things built, problems solved, ideas worth sharing."
  keywords = ["Azure", "Microsoft Azure", "Cloud", "DevOps", "Infrastructure", "Bicep", "Terraform", "IaC"]
  author = "Oli"
  # Reading time
  ShowReadingTime = true

  # Sharing / post meta
  ShowPostNavLinks = true
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = true
  ShowWordCount = false
  hideAuthor = true
  ShowRssButtonInSectionTermList = true
  ShowToc = true
  TocOpen = false
  ShowRelated = true
  ShowLastMod = true

  # Favicon — explicitly wire PaperMod's asset params to the generated files.
  # Setting safari_pinned_tab to "" suppresses the mask-icon tag so browsers
  # don't 404 on the missing safari-pinned-tab.svg.
  [params.assets]
    favicon           = "favicon.ico"
    favicon16x16      = "favicon-16x16.png"
    favicon32x32      = "favicon-32x32.png"
    apple_touch_icon  = "apple-touch-icon.png"
    safari_pinned_tab = ""

  # Comments — powered by Giscus (see layouts/partials/comments.html)
  comments = true

  # Dark mode: "auto" | "light" | "dark"
  # "auto" uses system preference; the toggle lets users override
  defaultTheme = "dark"
  disableThemeToggle = false

  # Search
  fuseOpts = { isCaseSensitive = false, shouldSort = true, location = 0, distance = 1000, threshold = 0.4, minMatchCharLength = 0, limit = 10, keys = ["title", "permalink", "summary", "content"] }

  # Social links shown in the footer
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/oli-kwski"

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/oli-k/"


  # Navbar logo
  [params.label]
    text = "HITC"

  # Cover image defaults
  [params.cover]
    hidden = false
    hiddenInList = false
    hiddenInSingle = false

  # Home page profile block
  [params.profileMode]
    enabled  = true
    title    = "Head in the Cloud"
    subtitle = "Azure focused - things built, problems solved, ideas worth sharing."
    imageUrl = "/my_avatar_profile.png"
    imageWidth  = 200
    imageHeight = 200
    imageTitle  = "Head in the Cloud"

    [[params.profileMode.buttons]]
      name = "Posts"
      url  = "/posts/"

    [[params.profileMode.buttons]]
      name = "About"
      url  = "/about/"

# ---------------------------------------------------------------------------
# Navigation menu
# ---------------------------------------------------------------------------
[[menu.main]]
  identifier = "about"
  name = "About"
  url = "/about/"
  weight = 5

[[menu.main]]
  identifier = "series"
  name = "Series"
  url = "/series/"
  weight = 10

[[menu.main]]
  identifier = "posts"
  name = "Posts"
  url = "/posts/"
  weight = 15

[[menu.main]]
  identifier = "archives"
  name = "Archives"
  url = "/archives/"
  weight = 20

[[menu.main]]
  identifier = "search"
  name = "Search"
  url = "/search/"
  weight = 25

# ---------------------------------------------------------------------------
# Taxonomy
# ---------------------------------------------------------------------------
[taxonomies]
  tag = "tags"
  series = "series"

# ---------------------------------------------------------------------------
# Related posts — drives the "Related" block PaperMod renders under each post
# ---------------------------------------------------------------------------
[related]
  threshold = 80
  includeNewer = true
  toLower = false

  [[related.indices]]
    name = "series"
    weight = 100

  [[related.indices]]
    name = "tags"
    weight = 80

  [[related.indices]]
    name = "categories"
    weight = 40

  [[related.indices]]
    name = "date"
    weight = 10

# ---------------------------------------------------------------------------
# Markup
# ---------------------------------------------------------------------------
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true          # allows raw HTML in markdown (needed for callout shortcodes etc.)
  [markup.highlight]
    noClasses = false        # use external CSS classes so we can theme syntax highlighting
    anchorLineNos = false
    codeFences = true
    guessSyntax = true
    lineNos = false          # off by default — re-enable per-fence with {linenos=table} when needed
    style = "github-dark"    # will be overridden by our custom CSS in dark mode
    # Bicep is supported natively by Chroma 2.10+ (shipped with Hugo 0.160).
    # Use ```bicep fences — no extra config required.