{{- /* Favicon */}}
<link rel="icon" type="image/png" sizes="256x256" href="/hitc-favicon.png">
<link rel="apple-touch-icon" href="/hitc-favicon.png">

<style>
  figure.diagram { padding: 1.25rem; border-radius: 6px; margin: 1.5rem 0; max-width: 400px; background-color: #ebebeb; }
  figure.diagram figcaption { color: #555; }
  [data-theme="dark"] figure.diagram { background-color: rgb(126, 127, 133); }
  [data-theme="dark"] figure.diagram figcaption { color: #1a1a1a; }
</style>

{{- /* Cloudflare Web Analytics is now in "Automatic" mode and injected at
       the edge for proxied (orange-cloud) responses — no manual beacon
       needed. Re-add a conditional <script> here if you ever go back to
       the JS-snippet path for a non-proxied environment. */ -}}

{{- /* --- OG / Twitter card image -----------------------------------------
       Generated at build time per page by layouts/partials/og-image.html.
       The partial overlays the page title onto assets/images/og-template.png
       using Hugo's images.Text filter, so every page gets a unique branded
       card with no manual asset work.

       Skipped on the home page only when no title is set (rare). PaperMod
       does not emit og:image by default unless cover.image is in front-
       matter, so these tags are the canonical source.
*/ -}}
{{- $card := partial "og-image.html" . -}}
{{- if $card }}
  <meta property="og:image" content="{{ $card.Permalink }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:alt" content="{{ .Title | default .Site.Title }} — {{ .Site.Title }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="{{ $card.Permalink }}">
  <meta name="twitter:image:alt" content="{{ .Title | default .Site.Title }} — {{ .Site.Title }}">
{{- end }}
